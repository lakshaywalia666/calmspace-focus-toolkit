<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1417">
    <meta name="description" content="A browser toolkit for focus sessions, guided breathing, ambient sound, and short breaks.">
    <title>CalmSpace Focus Studio</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="assets/studio.css">
    <link rel="stylesheet" href="assets/accessibility.css">
    <script type="module" src="assets/home.js"></script>
</head>
<body>
    <header class="site-header shell">
        <p><strong>CalmSpace</strong></p>
        <button class="button" id="install" type="button" hidden>Install CalmSpace</button>
    </header>
    <main class="page shell">
        <div class="intro">
            <h1>Focus Studio</h1>
            <p>Set a focus timer, mix ambient sound, or take a short break.</p>
            <div class="row">
                <a class="button primary" href="tools/focus.html">Open focus room</a>
                <a class="button" href="tools/breathing.html">Take a breathing break</a>
                <a class="button" id="quick-start" href="tools/focus.html?start=saved" hidden>Start saved routine</a>
            </div>
        </div>
        <section class="panel stack shortcuts" id="shortcuts" aria-label="Tool shortcuts" hidden>
            <div class="stack" id="favorites-section" hidden>
                <h2>Favorites</h2>
                <div class="row" id="favorites"></div>
            </div>
            <div class="stack" id="recent-section" hidden>
                <h2>Recent tools</h2>
                <div class="row" id="recent"></div>
            </div>
        </section>
        <div class="launcher-search">
            <label for="search">Find a tool</label>
            <input type="search" id="search" placeholder="Search tools" autocomplete="off">
            <p id="search-status" class="visually-hidden" role="status"></p>
        </div>
        <div class="stack" id="tools"></div>
        <noscript>Enable JavaScript to use the tools and save shortcuts.</noscript>
    </main>
</body>
</html>
