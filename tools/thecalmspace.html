<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1417">
    <title>Write and Forget · CalmSpace</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icon-192.png">
    <link rel="stylesheet" href="../assets/studio.css">
    <link rel="stylesheet" href="../assets/accessibility.css">
    <script type="module" src="../assets/writing.js"></script>
</head>
<body>
    <header class="shell site-header"><a href="../index.html">← CalmSpace home</a></header>
    <main class="shell page">
        <div class="intro">
            <h1>Write and Forget</h1>
            <p>Write down what’s on your mind and discard it. CalmSpace keeps your text only while it’s in this field.</p>
        </div>
        <form class="panel stack" id="thought-form" autocomplete="off">
            <label for="thought-input">What’s on your mind?</label>
            <textarea id="thought-input" rows="8" autocomplete="off" spellcheck="false" required></textarea>
            <div class="row"><button type="submit" class="button primary">Discard thought</button></div>
            <p class="status" id="thought-status" role="status"></p>
        </form>
        <section class="panel stack" id="legacy-entries" aria-labelledby="legacy-heading" hidden>
            <h2 id="legacy-heading">Previously saved entries</h2>
            <p class="muted">An earlier version stored your entries in this browser. You can delete them here.</p>
            <div class="row"><button type="button" class="button" id="clear-legacy">Delete old entries</button></div>
        </section>
        <p class="status" id="legacy-status" role="status"></p>
    </main>
</body>
</html>
