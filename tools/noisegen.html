<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1417">
    <title>Sound Mixer · CalmSpace</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icon-192.png">
    <link rel="stylesheet" href="../assets/studio.css">
    <link rel="stylesheet" href="../assets/accessibility.css">
    <script type="module" src="../assets/mixer.js"></script>
</head>
<body>
    <header class="shell site-header">
        <a href="../index.html">← CalmSpace home</a>
        <a href="focus.html">Focus room</a>
    </header>
    <main class="shell page">
        <div class="intro">
            <h1>Sound Mixer</h1>
            <p>Adjust each layer and save mixes to reuse here or in the focus room.</p>
        </div>
        <div class="focus-grid">
            <section class="panel stack" aria-labelledby="layers-heading">
                <div class="row between">
                    <h2 id="layers-heading">Sound layers</h2>
                    <button type="button" class="button primary" id="play">Play sound</button>
                </div>
                <div class="stack" id="tracks"></div>
                <div class="track">
                    <label for="volume">Master</label>
                    <input id="volume" type="range" min="0" max="100" value="75">
                    <output id="volume-value" for="volume">75%</output>
                </div>
                <p class="status" id="play-status" role="status"></p>
            </section>
            <section class="panel stack" aria-labelledby="mixes-heading">
                <h2 id="mixes-heading">Mix presets</h2>
                <label class="field" for="mix-select">Load a mix
                    <select id="mix-select"></select>
                </label>
                <button type="button" class="button" id="delete-mix" hidden>Delete this mix</button>
                <form class="stack" id="save-mix">
                    <label class="field" for="mix-name">Save current mix as
                        <input type="text" id="mix-name" maxlength="36" required placeholder="Mix name">
                    </label>
                    <div class="row"><button type="submit" class="button">Save mix</button></div>
                </form>
                <p class="status" id="mix-status" role="status"></p>
            </section>
        </div>
    </main>
</body>
</html>
