<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1417">
    <title>Focus Room · CalmSpace</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icon-192.png">
    <link rel="stylesheet" href="../assets/studio.css">
    <link rel="stylesheet" href="../assets/accessibility.css">
    <script type="module" src="../assets/focus.js"></script>
</head>
<body>
    <header class="shell site-header">
        <a href="../index.html">← CalmSpace home</a>
        <a href="noisegen.html">Sound mixer</a>
    </header>
    <main class="shell page">
        <div class="intro">
            <h1>Focus Room</h1>
            <p>Set a timer and choose how you want to spend your break.</p>
        </div>
        <div class="focus-grid">
            <section class="panel stack focus-clock" aria-labelledby="phase">
                <h2 id="phase">Focus timer</h2>
                <div class="dial" id="dial">
                    <div class="dial-face"><span class="timer" id="timer" role="timer">25:00</span></div>
                </div>
                <div class="row">
                    <button class="button primary" id="timer-action" type="submit" form="routine-form">Start focus</button>
                    <button class="button" id="reset" type="button" hidden>Reset</button>
                    <button class="button primary" id="start-break" type="button" hidden>Start timed break</button>
                    <a class="button" id="breathe" href="breathing.html?from=focus" hidden>Take a breathing break</a>
                </div>
                <p class="status" id="timer-status" role="status"></p>
            </section>
            <section class="panel stack" aria-labelledby="setup-heading">
                <h2 id="setup-heading">Routine settings</h2>
                <form id="routine-form" class="stack">
                    <div class="options">
                        <label for="focus-minutes">Focus minutes
                            <input type="number" id="focus-minutes" min="0" max="779" step="1" value="25" required>
                        </label>
                        <label for="focus-seconds">Focus seconds
                            <input type="number" id="focus-seconds" min="0" max="59" step="1" value="0" required>
                        </label>
                    </div>
                    <label class="field" for="break-minutes">Break minutes
                        <input type="number" id="break-minutes" min="1" max="60" step="1" value="5" required>
                    </label>
                    <label class="field" for="sound-preset">Focus sound
                        <select id="sound-preset"></select>
                    </label>
                    <div class="track">
                        <label for="sound-volume">Volume</label>
                        <input type="range" id="sound-volume" min="0" max="100" value="75">
                        <output id="volume-value" for="sound-volume">75%</output>
                    </div>
                    <div class="row">
                        <button class="button" id="sound-action" type="button" hidden>Enable sound</button>
                        <button class="button" id="save-routine" type="button">Save routine</button>
                    </div>
                </form>
                <p class="status" id="sound-status" role="status"></p>
                <p class="status" id="routine-status" role="status"></p>
            </section>
        </div>
        <section class="panel stack" aria-labelledby="history-heading">
            <div class="row between">
                <h2 id="history-heading">Focus history</h2>
                <button class="button" id="clear-history" type="button" hidden>Clear history</button>
            </div>
            <label class="check-row" for="track-history"><input type="checkbox" id="track-history"> <span>Save completed focus sessions on this device</span></label>
            <p class="muted" id="history-empty">No saved sessions yet.</p>
            <ul class="history-list" id="history-list" aria-label="Daily focus totals"></ul>
            <p class="status" id="history-status" role="status"></p>
        </section>
    </main>
</body>
</html>
